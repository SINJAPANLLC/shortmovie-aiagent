{% extends "base.html" %}
{% block title %}Newプロダクション - CEOの扉{% endblock %}
{% block content %}
<div class="page-header">
    <h1 data-testid="text-page-title">Newプロダクション</h1>
</div>

<div class="np-tabs" data-testid="tabs-container">
    <button class="np-tab active" data-tab="claude" data-testid="tab-claude">Claude</button>
    <button class="np-tab" data-tab="gemini" data-testid="tab-gemini">Gemini</button>
    <button class="np-tab" data-tab="kling" data-testid="tab-kling">Kling</button>
</div>

<div class="np-panel active" id="panel-claude">
    <div class="np-claude-layout">
        <div class="np-chat-container">
            <div class="np-chat-messages" id="claude-messages" data-testid="chat-claude-messages">
                <div class="np-chat-welcome">脚本・キャラ・動画プロンプトを生成できます<br><small style="color:#999;">Claudeの回答から「プレビューに送る」で右パネルに表示</small></div>
            </div>
            <div class="np-chat-input-area">
                <textarea id="claude-input" class="np-chat-input" data-testid="input-claude" placeholder="例: CEOドラマの第1話の脚本を書いて" rows="3"></textarea>
                <button id="claude-send" class="np-chat-send" data-testid="button-claude-send">送信</button>
            </div>
        </div>
        <div class="np-preview-panel">
            <div class="np-preview-header">
                <h3>プレビュー</h3>
                <div class="np-preview-actions">
                    <select id="claude-save-type" class="np-select-sm" data-testid="select-save-type">
                        <option value="script">脚本</option>
                        <option value="character_prompt">キャラプロンプト</option>
                        <option value="video_prompt">動画プロンプト</option>
                        <option value="image_prompt">画像プロンプト</option>
                        <option value="other">その他</option>
                    </select>
                </div>
            </div>
            <div class="np-preview-content" id="claude-preview-area" data-testid="area-claude-preview">
                <div class="np-preview-empty">チャットの回答から「プレビューに送る」ボタンで内容を表示</div>
            </div>
            <div class="np-preview-footer">
                <input type="text" id="claude-save-name" class="np-save-name" data-testid="input-save-name" placeholder="保存名を入力...">
                <button id="claude-save-btn" class="np-save-btn" data-testid="button-save-content" disabled>保存</button>
                <button id="claude-copy-btn" class="np-copy-btn" data-testid="button-copy-content" disabled>コピー</button>
                <button id="claude-send-kling-btn" class="np-kling-send-btn" data-testid="button-send-to-kling" disabled>Klingに送る</button>
            </div>
            <div class="np-saved-list">
                <h4>保存済み <span id="claude-saved-count" data-testid="text-saved-count">0</span>件</h4>
                <div id="claude-saved-items" data-testid="list-saved-items"></div>
            </div>
        </div>
    </div>
</div>

<div class="np-panel" id="panel-gemini">
    <div class="np-gemini-layout">
        <div class="np-gemini-form-panel">
            <h3>画像生成 (Gemini)</h3>
            <div class="np-form-group">
                <label>参考キャラ画像（任意）</label>
                <input type="file" id="gemini-ref-image" class="np-file-input" data-testid="input-gemini-ref-image" accept="image/*" multiple>
                <div id="gemini-ref-preview" class="np-ref-preview" data-testid="area-gemini-ref-preview"></div>
            </div>
            <div class="np-form-group">
                <label>画像プロンプト</label>
                <textarea id="gemini-prompt" class="np-chat-input" data-testid="input-gemini-prompt" placeholder="例: 20代の日本人女性、黒いロングヘア、白いブラウス、オフィスの窓際に立っている、夕日の逆光、映画的な構図" rows="5"></textarea>
            </div>
            <div class="np-form-row">
                <div class="np-form-group">
                    <label>スタイル</label>
                    <select id="gemini-style" class="np-select" data-testid="select-gemini-style">
                        <option value="">指定なし</option>
                        <option value="photorealistic">写実的</option>
                        <option value="cinematic">映画的</option>
                        <option value="anime">アニメ風</option>
                        <option value="illustration">イラスト</option>
                        <option value="oil_painting">油絵風</option>
                    </select>
                </div>
                <div class="np-form-group">
                    <label>アスペクト比</label>
                    <select id="gemini-aspect" class="np-select" data-testid="select-gemini-aspect">
                        <option value="9:16" selected>9:16 (縦)</option>
                        <option value="16:9">16:9 (横)</option>
                        <option value="1:1">1:1 (正方形)</option>
                    </select>
                </div>
            </div>
            <button id="gemini-generate" class="np-kling-btn" data-testid="button-gemini-generate">画像を生成</button>
            <div id="gemini-status" class="np-kling-status" data-testid="text-gemini-status"></div>
        </div>
        <div class="np-gemini-result-panel">
            <h3>生成結果</h3>
            <div id="gemini-result-area" class="np-gemini-results-grid" data-testid="area-gemini-results"></div>
        </div>
    </div>
</div>

<div class="np-panel" id="panel-kling">
    <div class="np-kling-container">
        <div class="np-kling-form">
            <h3>動画生成</h3>
            <div class="np-form-group">
                <label>生成モード</label>
                <select id="kling-mode" class="np-select" data-testid="select-kling-mode">
                    <option value="text2video">テキスト → 動画</option>
                    <option value="image2video">画像 → 動画</option>
                </select>
            </div>
            <div class="np-form-group">
                <label>プロンプト</label>
                <textarea id="kling-prompt" class="np-chat-input" data-testid="input-kling-prompt" placeholder="動画の説明を入力..." rows="4"></textarea>
            </div>
            <div class="np-form-group" id="kling-image-group" style="display:none;">
                <label>参照画像</label>
                <input type="file" id="kling-image" class="np-file-input" data-testid="input-kling-image" accept="image/*">
                <div id="kling-image-preview" class="np-image-preview"></div>
            </div>
            <div class="np-form-row">
                <div class="np-form-group">
                    <label>アスペクト比</label>
                    <select id="kling-aspect" class="np-select" data-testid="select-kling-aspect">
                        <option value="9:16" selected>9:16 (縦)</option>
                        <option value="16:9">16:9 (横)</option>
                        <option value="1:1">1:1 (正方形)</option>
                    </select>
                </div>
                <div class="np-form-group">
                    <label>時間</label>
                    <select id="kling-duration" class="np-select" data-testid="select-kling-duration">
                        <option value="5" selected>5秒</option>
                        <option value="10">10秒</option>
                    </select>
                </div>
            </div>
            <button id="kling-generate" class="np-kling-btn" data-testid="button-kling-generate">生成開始</button>
        </div>
        <div class="np-kling-results">
            <h3>生成結果</h3>
            <div id="kling-status" class="np-kling-status" data-testid="text-kling-status"></div>
            <div id="kling-result-area" data-testid="area-kling-result"></div>
        </div>
    </div>
</div>

<style>
.np-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 0;
    border-bottom: 2px solid var(--border);
}
.np-tab {
    padding: 12px 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
}
.np-tab:hover { color: var(--accent); background: var(--bg-hover); }
.np-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.np-panel { display: none; }
.np-panel.active { display: block; }

.np-claude-layout {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 0;
    height: calc(100vh - 200px);
}
.np-chat-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0 0 0 12px;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}
.np-chat-full {
    border-radius: 0 0 12px 12px;
    height: calc(100vh - 200px);
}
.np-chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
.np-chat-welcome { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 16px; }
.np-msg { margin-bottom: 16px; display: flex; flex-direction: column; }
.np-msg.user { align-items: flex-end; }
.np-msg.assistant { align-items: flex-start; }
.np-msg-label { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; color: var(--text-secondary); }
.np-msg-bubble {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}
.np-msg.user .np-msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.np-msg.assistant .np-msg-bubble { background: var(--bg-hover); color: var(--text-primary); border-bottom-left-radius: 4px; }
.np-msg-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
}
.np-msg-action-btn {
    padding: 4px 10px;
    font-size: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
}
.np-msg-action-btn:hover { background: var(--accent-dark); }
.np-msg-action-btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.np-msg-action-btn.secondary:hover { background: var(--bg-hover); }

.np-chat-input-area {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    border-radius: 0 0 0 12px;
}
.np-chat-full .np-chat-input-area { border-radius: 0 0 12px 12px; }
.np-chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    background: var(--bg-card);
}
.np-chat-input:focus { border-color: var(--accent); }
.np-chat-send {
    padding: 10px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    transition: background 0.2s;
}
.np-chat-send:hover { background: var(--accent-dark); }
.np-chat-send:disabled { background: var(--text-secondary); cursor: not-allowed; }

.np-preview-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 0 12px 0;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
}
.np-preview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-primary);
}
.np-preview-header h3 { font-size: 14px; color: var(--accent-dark); margin: 0; }
.np-select-sm {
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    background: var(--bg-card);
    outline: none;
}
.np-preview-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-primary);
}
.np-preview-empty { text-align: center; color: #aaa; padding: 40px 16px; font-size: 13px; }
.np-preview-footer {
    display: flex;
    gap: 6px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    flex-wrap: wrap;
}
.np-save-name {
    flex: 1;
    min-width: 100px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    background: var(--bg-card);
}
.np-save-name:focus { border-color: var(--accent); }
.np-save-btn, .np-copy-btn, .np-kling-send-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.np-save-btn { background: var(--accent); color: #fff; }
.np-save-btn:hover { background: var(--accent-dark); }
.np-copy-btn { background: #e0e0e0; color: #333; }
.np-copy-btn:hover { background: #ccc; }
.np-kling-send-btn { background: #ff6f00; color: #fff; }
.np-kling-send-btn:hover { background: #e65100; }
.np-save-btn:disabled, .np-copy-btn:disabled, .np-kling-send-btn:disabled {
    background: #ddd; color: #999; cursor: not-allowed;
}

.np-saved-list {
    border-top: 1px solid var(--border);
    max-height: 220px;
    overflow-y: auto;
}
.np-saved-list h4 {
    font-size: 12px;
    padding: 8px 12px;
    margin: 0;
    color: var(--text-secondary);
    background: var(--bg-primary);
    position: sticky;
    top: 0;
}
.np-saved-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
}
.np-saved-item:hover { background: var(--bg-hover); }
.np-saved-tag {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}
.np-saved-tag.script { background: var(--accent); }
.np-saved-tag.character_prompt { background: #7b1fa2; }
.np-saved-tag.video_prompt { background: #ff6f00; }
.np-saved-tag.image_prompt { background: #1565c0; }
.np-saved-tag.other { background: #757575; }
.np-saved-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-saved-actions { display: flex; gap: 4px; flex-shrink: 0; }
.np-saved-action {
    padding: 2px 6px;
    border: none;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
    background: #f0f0f0;
    color: #555;
}
.np-saved-action:hover { background: #e0e0e0; }
.np-saved-action.delete { color: var(--error); }
.np-saved-action.delete:hover { background: #fde; }

.np-gemini-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    height: calc(100vh - 200px);
}
.np-gemini-form-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0 0 0 12px;
    padding: 24px;
    overflow-y: auto;
}
.np-gemini-form-panel h3 { margin-bottom: 16px; color: var(--accent-dark); }
.np-gemini-result-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 0 12px 0;
    padding: 24px;
    overflow-y: auto;
}
.np-gemini-result-panel h3 { margin-bottom: 16px; color: var(--accent-dark); }
.np-gemini-results-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.np-gemini-result-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-primary);
}
.np-gemini-result-item img {
    width: 100%;
    display: block;
    cursor: pointer;
}
.np-gemini-result-actions {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
}
.np-gemini-result-btn {
    padding: 5px 12px;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.np-gemini-result-btn.download { background: var(--accent); color: #fff; text-decoration: none; display: inline-block; }
.np-gemini-result-btn.download:hover { background: var(--accent-dark); }
.np-gemini-result-btn.use-kling { background: #ff6f00; color: #fff; }
.np-gemini-result-btn.use-kling:hover { background: #e65100; }
.np-gemini-result-btn.save-img { background: #e0e0e0; color: #333; }
.np-gemini-result-btn.save-img:hover { background: #ccc; }
.np-ref-preview {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
}
.np-ref-preview img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
}
.np-gemini-empty {
    text-align: center;
    color: #aaa;
    padding: 60px 20px;
    font-size: 14px;
}

.np-kling-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 16px;
}
.np-kling-form, .np-kling-results {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
}
.np-kling-form h3, .np-kling-results h3 { margin-bottom: 16px; color: var(--accent-dark); }
.np-form-group { margin-bottom: 16px; }
.np-form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.np-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg-card);
    outline: none;
}
.np-select:focus { border-color: var(--accent); }
.np-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.np-file-input { width: 100%; padding: 8px; font-size: 13px; }
.np-image-preview { margin-top: 8px; }
.np-image-preview img { max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid var(--border); }
.np-kling-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.np-kling-btn:hover { background: var(--accent-dark); }
.np-kling-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }
.np-kling-status { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; display: none; }
.np-kling-status.processing { display: block; background: #fff8e1; color: #f57f17; border: 1px solid #ffcc02; }
.np-kling-status.complete { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.np-kling-status.error { display: block; background: #fbe9e7; color: #c62828; border: 1px solid #ef9a9a; }
.np-typing { display: inline-flex; gap: 4px; padding: 8px 12px; }
.np-typing span { width: 6px; height: 6px; background: var(--text-secondary); border-radius: 50%; animation: npBounce 1.2s infinite; }
.np-typing span:nth-child(2) { animation-delay: 0.2s; }
.np-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes npBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
@media (max-width: 900px) {
    .np-claude-layout { grid-template-columns: 1fr; height: auto; }
    .np-chat-container { height: 50vh; border-radius: 0 0 12px 12px; }
    .np-preview-panel { border-left: 1px solid var(--border); border-radius: 12px; margin-top: 12px; height: 50vh; }
    .np-gemini-layout { grid-template-columns: 1fr; height: auto; }
    .np-gemini-form-panel { border-radius: 0 0 12px 12px; }
    .np-gemini-result-panel { border-left: 1px solid var(--border); border-radius: 12px; margin-top: 12px; }
    .np-kling-container { grid-template-columns: 1fr; }
}
</style>

<script>
(function() {
    var tabs = document.querySelectorAll('.np-tab');
    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.np-panel').forEach(function(p) { p.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    var chatHistories = { claude: [], gemini: [] };
    var currentPreviewText = '';
    var savedItems = JSON.parse(localStorage.getItem('np_saved_items') || '[]');

    var previewArea = document.getElementById('claude-preview-area');
    var saveNameInput = document.getElementById('claude-save-name');
    var saveBtn = document.getElementById('claude-save-btn');
    var copyBtn = document.getElementById('claude-copy-btn');
    var sendKlingBtn = document.getElementById('claude-send-kling-btn');
    var savedCountEl = document.getElementById('claude-saved-count');
    var savedItemsEl = document.getElementById('claude-saved-items');

    function escapeHtml(t) {
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    function setPreview(text) {
        currentPreviewText = text;
        previewArea.innerHTML = '';
        previewArea.textContent = text;
        saveBtn.disabled = false;
        copyBtn.disabled = false;
        sendKlingBtn.disabled = false;
    }

    function typeLabels(t) {
        var m = { script: '脚本', character_prompt: 'キャラ', video_prompt: '動画P', image_prompt: '画像P', other: 'その他' };
        return m[t] || t;
    }

    function renderSavedItems() {
        savedItemsEl.innerHTML = '';
        savedCountEl.textContent = savedItems.length;
        savedItems.forEach(function(item, idx) {
            var div = document.createElement('div');
            div.className = 'np-saved-item';
            div.innerHTML = '<span class="np-saved-tag ' + item.type + '">' + typeLabels(item.type) + '</span>'
                + '<span class="np-saved-name">' + escapeHtml(item.name) + '</span>'
                + '<span class="np-saved-actions">'
                + '<button class="np-saved-action view-btn" data-idx="' + idx + '" data-testid="button-view-saved-' + idx + '">表示</button>'
                + '<button class="np-saved-action copy-saved-btn" data-idx="' + idx + '" data-testid="button-copy-saved-' + idx + '">コピー</button>'
                + '<button class="np-saved-action kling-saved-btn" data-idx="' + idx + '" data-testid="button-kling-saved-' + idx + '">Kling</button>'
                + '<button class="np-saved-action delete" data-idx="' + idx + '" data-testid="button-delete-saved-' + idx + '">削除</button>'
                + '</span>';
            savedItemsEl.appendChild(div);
        });
    }
    renderSavedItems();

    savedItemsEl.addEventListener('click', function(e) {
        var btn = e.target;
        var idx = parseInt(btn.dataset.idx);
        if (isNaN(idx)) return;
        var item = savedItems[idx];
        if (!item) return;
        if (btn.classList.contains('view-btn')) {
            setPreview(item.content);
            document.getElementById('claude-save-type').value = item.type;
            saveNameInput.value = item.name;
        } else if (btn.classList.contains('copy-saved-btn')) {
            navigator.clipboard.writeText(item.content).then(function() {
                btn.textContent = '✓';
                setTimeout(function() { btn.textContent = 'コピー'; }, 1000);
            });
        } else if (btn.classList.contains('kling-saved-btn')) {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.np-panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelector('[data-tab="kling"]').classList.add('active');
            document.getElementById('panel-kling').classList.add('active');
            document.getElementById('kling-prompt').value = item.content;
        } else if (btn.classList.contains('delete')) {
            if (confirm('「' + item.name + '」を削除しますか？')) {
                savedItems.splice(idx, 1);
                localStorage.setItem('np_saved_items', JSON.stringify(savedItems));
                renderSavedItems();
            }
        }
    });

    saveBtn.addEventListener('click', function() {
        var name = saveNameInput.value.trim();
        if (!name) { alert('保存名を入力してください'); return; }
        var type = document.getElementById('claude-save-type').value;
        savedItems.unshift({ name: name, type: type, content: currentPreviewText, date: new Date().toISOString() });
        localStorage.setItem('np_saved_items', JSON.stringify(savedItems));
        renderSavedItems();
        saveBtn.textContent = '保存しました';
        setTimeout(function() { saveBtn.textContent = '保存'; }, 1500);

        fetch('/api/new-production/save-content', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ name: name, type: type, content: currentPreviewText })
        });
    });

    copyBtn.addEventListener('click', function() {
        navigator.clipboard.writeText(currentPreviewText).then(function() {
            copyBtn.textContent = 'コピーしました';
            setTimeout(function() { copyBtn.textContent = 'コピー'; }, 1500);
        });
    });

    sendKlingBtn.addEventListener('click', function() {
        tabs.forEach(function(t) { t.classList.remove('active'); });
        document.querySelectorAll('.np-panel').forEach(function(p) { p.classList.remove('active'); });
        document.querySelector('[data-tab="kling"]').classList.add('active');
        document.getElementById('panel-kling').classList.add('active');
        document.getElementById('kling-prompt').value = currentPreviewText;
    });

    function addMessage(container, role, text, provider) {
        var welcome = container.querySelector('.np-chat-welcome');
        if (welcome) welcome.remove();
        var div = document.createElement('div');
        div.className = 'np-msg ' + role;
        var label = role === 'user' ? 'あなた' : provider.toUpperCase();
        var html = '<div class="np-msg-label">' + label + '</div><div class="np-msg-bubble">' + escapeHtml(text) + '</div>';
        if (role === 'assistant' && provider === 'claude') {
            html += '<div class="np-msg-actions">'
                + '<button class="np-msg-action-btn preview-btn" data-testid="button-preview-msg">プレビューに送る</button>'
                + '<button class="np-msg-action-btn secondary quick-copy-btn" data-testid="button-quick-copy">コピー</button>'
                + '</div>';
        }
        div.innerHTML = html;
        if (role === 'assistant' && provider === 'claude') {
            div.querySelector('.preview-btn').addEventListener('click', function() {
                setPreview(text);
                var lines = text.split('\n');
                var autoName = lines[0].substring(0, 40);
                if (lines[0].length > 40) autoName += '...';
                saveNameInput.value = autoName;
            });
            div.querySelector('.quick-copy-btn').addEventListener('click', function() {
                navigator.clipboard.writeText(text).then(function() {
                    div.querySelector('.quick-copy-btn').textContent = '✓';
                    setTimeout(function() { div.querySelector('.quick-copy-btn').textContent = 'コピー'; }, 1000);
                });
            });
        }
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function showTyping(container, provider) {
        var welcome = container.querySelector('.np-chat-welcome');
        if (welcome) welcome.remove();
        var div = document.createElement('div');
        div.className = 'np-msg assistant np-typing-indicator';
        div.innerHTML = '<div class="np-msg-label">' + provider.toUpperCase() + '</div><div class="np-msg-bubble"><div class="np-typing"><span></span><span></span><span></span></div></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping(container) {
        var el = container.querySelector('.np-typing-indicator');
        if (el) el.remove();
    }

    function setupChat(provider) {
        var input = document.getElementById(provider + '-input');
        var sendBtn = document.getElementById(provider + '-send');
        var messages = document.getElementById(provider + '-messages');

        function send() {
            var text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMessage(messages, 'user', text, provider);
            chatHistories[provider].push({ role: 'user', content: text });
            sendBtn.disabled = true;
            showTyping(messages, provider);

            fetch('/api/new-production/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ provider: provider, message: text, history: chatHistories[provider].slice(0, -1) })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                removeTyping(messages);
                if (data.error) {
                    addMessage(messages, 'assistant', 'エラー: ' + data.error, provider);
                } else {
                    addMessage(messages, 'assistant', data.response, provider);
                    chatHistories[provider].push({ role: 'assistant', content: data.response });
                }
                sendBtn.disabled = false;
                input.focus();
            })
            .catch(function(err) {
                removeTyping(messages);
                addMessage(messages, 'assistant', 'エラー: ' + err.message, provider);
                sendBtn.disabled = false;
            });
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
    }

    setupChat('claude');

    // Gemini image generation
    var geminiRefInput = document.getElementById('gemini-ref-image');
    var geminiRefPreview = document.getElementById('gemini-ref-preview');
    var geminiGenerateBtn = document.getElementById('gemini-generate');
    var geminiStatus = document.getElementById('gemini-status');
    var geminiResultArea = document.getElementById('gemini-result-area');
    var geminiImageCount = 0;

    geminiRefInput.addEventListener('change', function() {
        geminiRefPreview.innerHTML = '';
        Array.from(geminiRefInput.files).forEach(function(file) {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            geminiRefPreview.appendChild(img);
        });
    });

    geminiGenerateBtn.addEventListener('click', function() {
        var prompt = document.getElementById('gemini-prompt').value.trim();
        if (!prompt) return alert('プロンプトを入力してください');
        geminiGenerateBtn.disabled = true;
        geminiStatus.className = 'np-kling-status processing';
        geminiStatus.textContent = '画像を生成中...';

        var formData = new FormData();
        formData.append('prompt', prompt);
        formData.append('style', document.getElementById('gemini-style').value);
        formData.append('aspect_ratio', document.getElementById('gemini-aspect').value);
        if (geminiRefInput.files.length > 0) {
            Array.from(geminiRefInput.files).forEach(function(f) {
                formData.append('ref_images', f);
            });
        }

        fetch('/api/new-production/gemini-generate-image', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            geminiGenerateBtn.disabled = false;
            if (data.error) {
                geminiStatus.className = 'np-kling-status error';
                geminiStatus.textContent = 'エラー: ' + data.error;
            } else if (data.images && data.images.length > 0) {
                geminiStatus.className = 'np-kling-status complete';
                geminiStatus.textContent = data.images.length + '枚の画像を生成しました';
                data.images.forEach(function(imgUrl) {
                    geminiImageCount++;
                    var item = document.createElement('div');
                    item.className = 'np-gemini-result-item';
                    item.innerHTML = '<img src="' + imgUrl + '" data-testid="img-gemini-result-' + geminiImageCount + '">'
                        + '<div class="np-gemini-result-actions">'
                        + '<a href="' + imgUrl + '" download class="np-gemini-result-btn download" data-testid="button-download-gemini-' + geminiImageCount + '">ダウンロード</a>'
                        + '<button class="np-gemini-result-btn use-kling" data-url="' + imgUrl + '" data-testid="button-kling-gemini-' + geminiImageCount + '">Klingに送る</button>'
                        + '</div>';
                    geminiResultArea.insertBefore(item, geminiResultArea.firstChild);
                });
            } else {
                geminiStatus.className = 'np-kling-status error';
                geminiStatus.textContent = '画像が生成されませんでした';
            }
        })
        .catch(function(err) {
            geminiGenerateBtn.disabled = false;
            geminiStatus.className = 'np-kling-status error';
            geminiStatus.textContent = 'エラー: ' + err.message;
        });
    });

    geminiResultArea.addEventListener('click', function(e) {
        var btn = e.target;
        if (btn.classList.contains('use-kling')) {
            var imgUrl = btn.dataset.url;
            tabs.forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.np-panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelector('[data-tab="kling"]').classList.add('active');
            document.getElementById('panel-kling').classList.add('active');
            document.getElementById('kling-mode').value = 'image2video';
            document.getElementById('kling-image-group').style.display = 'block';
            document.getElementById('kling-prompt').value = document.getElementById('gemini-prompt').value;
            var preview = document.getElementById('kling-image-preview');
            preview.innerHTML = '<img src="' + imgUrl + '" style="max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--border);">';
            btn.textContent = '送信済み';
            setTimeout(function() { btn.textContent = 'Klingに送る'; }, 1500);
        }
    });

    var modeSelect = document.getElementById('kling-mode');
    var imageGroup = document.getElementById('kling-image-group');
    modeSelect.addEventListener('change', function() {
        imageGroup.style.display = modeSelect.value === 'image2video' ? 'block' : 'none';
    });

    var imageInput = document.getElementById('kling-image');
    var imagePreview = document.getElementById('kling-image-preview');
    imageInput.addEventListener('change', function() {
        imagePreview.innerHTML = '';
        if (imageInput.files[0]) {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(imageInput.files[0]);
            imagePreview.appendChild(img);
        }
    });

    var klingBtn = document.getElementById('kling-generate');
    var klingStatus = document.getElementById('kling-status');
    var klingResult = document.getElementById('kling-result-area');

    klingBtn.addEventListener('click', function() {
        var prompt = document.getElementById('kling-prompt').value.trim();
        if (!prompt) return alert('プロンプトを入力してください');
        klingBtn.disabled = true;
        klingStatus.className = 'np-kling-status processing';
        klingStatus.textContent = '生成中... しばらくお待ちください';
        klingResult.innerHTML = '';

        var formData = new FormData();
        formData.append('prompt', prompt);
        formData.append('mode', modeSelect.value);
        formData.append('aspect_ratio', document.getElementById('kling-aspect').value);
        formData.append('duration', document.getElementById('kling-duration').value);
        if (modeSelect.value === 'image2video' && imageInput.files[0]) {
            formData.append('image', imageInput.files[0]);
        }

        fetch('/api/new-production/kling-generate', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                klingStatus.className = 'np-kling-status error';
                klingStatus.textContent = 'エラー: ' + data.error;
                klingBtn.disabled = false;
            } else if (data.task_id) {
                pollKlingTask(data.task_id);
            }
        })
        .catch(function(err) {
            klingStatus.className = 'np-kling-status error';
            klingStatus.textContent = 'エラー: ' + err.message;
            klingBtn.disabled = false;
        });
    });

    function pollKlingTask(taskId) {
        fetch('/api/new-production/kling-status/' + taskId, { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'completed' && data.video_url) {
                klingStatus.className = 'np-kling-status complete';
                klingStatus.textContent = '生成完了';
                klingResult.innerHTML = '<video controls style="width:100%;max-height:500px;border-radius:8px;margin-top:8px;" data-testid="video-kling-result"><source src="' + data.video_url + '" type="video/mp4"></video><div style="margin-top:8px;"><a href="' + data.video_url + '" download class="np-kling-btn" style="display:inline-block;text-align:center;text-decoration:none;padding:8px 16px;font-size:13px;" data-testid="link-kling-download">ダウンロード</a></div>';
                klingBtn.disabled = false;
            } else if (data.status === 'failed') {
                klingStatus.className = 'np-kling-status error';
                klingStatus.textContent = 'エラー: ' + (data.error || '生成に失敗しました');
                klingBtn.disabled = false;
            } else {
                klingStatus.textContent = '生成中... (' + (data.status || 'processing') + ')';
                setTimeout(function() { pollKlingTask(taskId); }, 5000);
            }
        })
        .catch(function() {
            setTimeout(function() { pollKlingTask(taskId); }, 5000);
        });
    }
})();
</script>
{% endblock %}
