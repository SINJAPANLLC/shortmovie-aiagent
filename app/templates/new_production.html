{% extends "base.html" %}
{% block title %}Newプロダクション - CEOの扉{% endblock %}
{% block content %}
<div class="page-header">
    <h1 data-testid="text-page-title">Newプロダクション</h1>
</div>

<div class="np-tabs" data-testid="tabs-container">
    <button class="np-tab active" data-tab="claude" data-testid="tab-claude">Claude</button>
    <button class="np-tab" data-tab="gemini" data-testid="tab-gemini">Gemini</button>
    <button class="np-tab" data-tab="kling" data-testid="tab-kling">Kling</button>
</div>

<div class="np-panel active" id="panel-claude">
    <div class="np-chat-container">
        <div class="np-chat-messages" id="claude-messages" data-testid="chat-claude-messages">
            <div class="np-chat-welcome">Claudeに何でも聞いてください</div>
        </div>
        <div class="np-chat-input-area">
            <textarea id="claude-input" class="np-chat-input" data-testid="input-claude" placeholder="メッセージを入力..." rows="3"></textarea>
            <button id="claude-send" class="np-chat-send" data-testid="button-claude-send">送信</button>
        </div>
    </div>
</div>

<div class="np-panel" id="panel-gemini">
    <div class="np-chat-container">
        <div class="np-chat-messages" id="gemini-messages" data-testid="chat-gemini-messages">
            <div class="np-chat-welcome">Geminiに何でも聞いてください</div>
        </div>
        <div class="np-chat-input-area">
            <textarea id="gemini-input" class="np-chat-input" data-testid="input-gemini" placeholder="メッセージを入力..." rows="3"></textarea>
            <button id="gemini-send" class="np-chat-send" data-testid="button-gemini-send">送信</button>
        </div>
    </div>
</div>

<div class="np-panel" id="panel-kling">
    <div class="np-kling-container">
        <div class="np-kling-form">
            <h3>動画生成</h3>
            <div class="np-form-group">
                <label>生成モード</label>
                <select id="kling-mode" class="np-select" data-testid="select-kling-mode">
                    <option value="text2video">テキスト → 動画</option>
                    <option value="image2video">画像 → 動画</option>
                </select>
            </div>
            <div class="np-form-group">
                <label>プロンプト</label>
                <textarea id="kling-prompt" class="np-chat-input" data-testid="input-kling-prompt" placeholder="動画の説明を入力..." rows="4"></textarea>
            </div>
            <div class="np-form-group" id="kling-image-group" style="display:none;">
                <label>参照画像</label>
                <input type="file" id="kling-image" class="np-file-input" data-testid="input-kling-image" accept="image/*">
                <div id="kling-image-preview" class="np-image-preview"></div>
            </div>
            <div class="np-form-row">
                <div class="np-form-group">
                    <label>アスペクト比</label>
                    <select id="kling-aspect" class="np-select" data-testid="select-kling-aspect">
                        <option value="9:16" selected>9:16 (縦)</option>
                        <option value="16:9">16:9 (横)</option>
                        <option value="1:1">1:1 (正方形)</option>
                    </select>
                </div>
                <div class="np-form-group">
                    <label>時間</label>
                    <select id="kling-duration" class="np-select" data-testid="select-kling-duration">
                        <option value="5" selected>5秒</option>
                        <option value="10">10秒</option>
                    </select>
                </div>
            </div>
            <button id="kling-generate" class="np-kling-btn" data-testid="button-kling-generate">生成開始</button>
        </div>
        <div class="np-kling-results">
            <h3>生成結果</h3>
            <div id="kling-status" class="np-kling-status" data-testid="text-kling-status"></div>
            <div id="kling-result-area" data-testid="area-kling-result"></div>
        </div>
    </div>
</div>

<style>
.np-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 0;
    border-bottom: 2px solid var(--border);
}
.np-tab {
    padding: 12px 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
}
.np-tab:hover {
    color: var(--accent);
    background: var(--bg-hover);
}
.np-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}
.np-panel {
    display: none;
}
.np-panel.active {
    display: block;
}
.np-chat-container {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 0 0 12px 12px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 200px);
}
.np-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}
.np-chat-welcome {
    text-align: center;
    color: var(--text-secondary);
    padding: 60px 20px;
    font-size: 16px;
}
.np-msg {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
}
.np-msg.user {
    align-items: flex-end;
}
.np-msg.assistant {
    align-items: flex-start;
}
.np-msg-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--text-secondary);
}
.np-msg-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}
.np-msg.user .np-msg-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
}
.np-msg.assistant .np-msg-bubble {
    background: var(--bg-hover);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
}
.np-chat-input-area {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
    border-radius: 0 0 12px 12px;
}
.np-chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    background: var(--bg-card);
}
.np-chat-input:focus {
    border-color: var(--accent);
}
.np-chat-send {
    padding: 10px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    align-self: flex-end;
    transition: background 0.2s;
}
.np-chat-send:hover {
    background: var(--accent-dark);
}
.np-chat-send:disabled {
    background: var(--text-secondary);
    cursor: not-allowed;
}
.np-kling-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 16px;
}
.np-kling-form, .np-kling-results {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
}
.np-kling-form h3, .np-kling-results h3 {
    margin-bottom: 16px;
    color: var(--accent-dark);
}
.np-form-group {
    margin-bottom: 16px;
}
.np-form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-secondary);
}
.np-select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg-card);
    outline: none;
}
.np-select:focus {
    border-color: var(--accent);
}
.np-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.np-file-input {
    width: 100%;
    padding: 8px;
    font-size: 13px;
}
.np-image-preview {
    margin-top: 8px;
}
.np-image-preview img {
    max-width: 200px;
    max-height: 200px;
    border-radius: 8px;
    border: 1px solid var(--border);
}
.np-kling-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.np-kling-btn:hover {
    background: var(--accent-dark);
}
.np-kling-btn:disabled {
    background: var(--text-secondary);
    cursor: not-allowed;
}
.np-kling-status {
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
    display: none;
}
.np-kling-status.processing {
    display: block;
    background: #fff8e1;
    color: #f57f17;
    border: 1px solid #ffcc02;
}
.np-kling-status.complete {
    display: block;
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
}
.np-kling-status.error {
    display: block;
    background: #fbe9e7;
    color: #c62828;
    border: 1px solid #ef9a9a;
}
.np-typing {
    display: inline-flex;
    gap: 4px;
    padding: 8px 12px;
}
.np-typing span {
    width: 6px;
    height: 6px;
    background: var(--text-secondary);
    border-radius: 50%;
    animation: npBounce 1.2s infinite;
}
.np-typing span:nth-child(2) { animation-delay: 0.2s; }
.np-typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes npBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}
@media (max-width: 768px) {
    .np-kling-container {
        grid-template-columns: 1fr;
    }
}
</style>

<script>
(function() {
    var tabs = document.querySelectorAll('.np-tab');
    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            tabs.forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.np-panel').forEach(function(p) { p.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    var chatHistories = { claude: [], gemini: [] };

    function addMessage(container, role, text) {
        var welcome = container.querySelector('.np-chat-welcome');
        if (welcome) welcome.remove();
        var div = document.createElement('div');
        div.className = 'np-msg ' + role;
        div.innerHTML = '<div class="np-msg-label">' + (role === 'user' ? 'あなた' : container.id.replace('-messages','').toUpperCase()) + '</div><div class="np-msg-bubble">' + escapeHtml(text) + '</div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function showTyping(container) {
        var welcome = container.querySelector('.np-chat-welcome');
        if (welcome) welcome.remove();
        var div = document.createElement('div');
        div.className = 'np-msg assistant np-typing-indicator';
        div.innerHTML = '<div class="np-msg-label">' + container.id.replace('-messages','').toUpperCase() + '</div><div class="np-msg-bubble"><div class="np-typing"><span></span><span></span><span></span></div></div>';
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTyping(container) {
        var el = container.querySelector('.np-typing-indicator');
        if (el) el.remove();
    }

    function escapeHtml(t) {
        var d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }

    function setupChat(provider) {
        var input = document.getElementById(provider + '-input');
        var sendBtn = document.getElementById(provider + '-send');
        var messages = document.getElementById(provider + '-messages');

        function send() {
            var text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMessage(messages, 'user', text);
            chatHistories[provider].push({ role: 'user', content: text });
            sendBtn.disabled = true;
            showTyping(messages);

            fetch('/api/new-production/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ provider: provider, message: text, history: chatHistories[provider].slice(0, -1) })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                removeTyping(messages);
                if (data.error) {
                    addMessage(messages, 'assistant', 'エラー: ' + data.error);
                } else {
                    addMessage(messages, 'assistant', data.response);
                    chatHistories[provider].push({ role: 'assistant', content: data.response });
                }
                sendBtn.disabled = false;
                input.focus();
            })
            .catch(function(err) {
                removeTyping(messages);
                addMessage(messages, 'assistant', 'エラー: ' + err.message);
                sendBtn.disabled = false;
            });
        }

        sendBtn.addEventListener('click', send);
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });
    }

    setupChat('claude');
    setupChat('gemini');

    var modeSelect = document.getElementById('kling-mode');
    var imageGroup = document.getElementById('kling-image-group');
    modeSelect.addEventListener('change', function() {
        imageGroup.style.display = modeSelect.value === 'image2video' ? 'block' : 'none';
    });

    var imageInput = document.getElementById('kling-image');
    var imagePreview = document.getElementById('kling-image-preview');
    imageInput.addEventListener('change', function() {
        imagePreview.innerHTML = '';
        if (imageInput.files[0]) {
            var img = document.createElement('img');
            img.src = URL.createObjectURL(imageInput.files[0]);
            imagePreview.appendChild(img);
        }
    });

    var klingBtn = document.getElementById('kling-generate');
    var klingStatus = document.getElementById('kling-status');
    var klingResult = document.getElementById('kling-result-area');

    klingBtn.addEventListener('click', function() {
        var prompt = document.getElementById('kling-prompt').value.trim();
        if (!prompt) return alert('プロンプトを入力してください');
        klingBtn.disabled = true;
        klingStatus.className = 'np-kling-status processing';
        klingStatus.textContent = '生成中... しばらくお待ちください';
        klingResult.innerHTML = '';

        var formData = new FormData();
        formData.append('prompt', prompt);
        formData.append('mode', modeSelect.value);
        formData.append('aspect_ratio', document.getElementById('kling-aspect').value);
        formData.append('duration', document.getElementById('kling-duration').value);
        if (modeSelect.value === 'image2video' && imageInput.files[0]) {
            formData.append('image', imageInput.files[0]);
        }

        fetch('/api/new-production/kling-generate', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                klingStatus.className = 'np-kling-status error';
                klingStatus.textContent = 'エラー: ' + data.error;
                klingBtn.disabled = false;
            } else if (data.task_id) {
                pollKlingTask(data.task_id);
            }
        })
        .catch(function(err) {
            klingStatus.className = 'np-kling-status error';
            klingStatus.textContent = 'エラー: ' + err.message;
            klingBtn.disabled = false;
        });
    });

    function pollKlingTask(taskId) {
        fetch('/api/new-production/kling-status/' + taskId, { credentials: 'same-origin' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'completed' && data.video_url) {
                klingStatus.className = 'np-kling-status complete';
                klingStatus.textContent = '生成完了';
                klingResult.innerHTML = '<video controls style="width:100%;max-height:500px;border-radius:8px;margin-top:8px;" data-testid="video-kling-result"><source src="' + data.video_url + '" type="video/mp4"></video><div style="margin-top:8px;"><a href="' + data.video_url + '" download class="np-kling-btn" style="display:inline-block;text-align:center;text-decoration:none;padding:8px 16px;font-size:13px;" data-testid="link-kling-download">ダウンロード</a></div>';
                klingBtn.disabled = false;
            } else if (data.status === 'failed') {
                klingStatus.className = 'np-kling-status error';
                klingStatus.textContent = 'エラー: ' + (data.error || '生成に失敗しました');
                klingBtn.disabled = false;
            } else {
                klingStatus.textContent = '生成中... (' + (data.status || 'processing') + ')';
                setTimeout(function() { pollKlingTask(taskId); }, 5000);
            }
        })
        .catch(function() {
            setTimeout(function() { pollKlingTask(taskId); }, 5000);
        });
    }
})();
</script>
{% endblock %}
